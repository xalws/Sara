<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://www.geogebra.org/apps/deployggb.js"></script>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #FFFFFF;
        }
        #ggb-element {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
<div id="ggb-element"></div>

<script>
    var CURVA = "gfCurva";
    var EVAL  = "gfEval";
    var HF    = "gfH";
    var X0    = "gfX0";
    var Y0    = "gfY0";

    var ggb = null;
    var paramsActuales = [];

    function enviar(tipo, obj) {
        try {
            if (window.Android) Android.evento(tipo, typeof obj === "string" ? obj : JSON.stringify(obj));
        } catch (e) { console.error(e); }
    }

    window.onerror = function (msg, src, linea) {
        enviar("error", "Error en la página: " + msg + " (línea " + linea + ")");
    };

    function borrar(nombre) {
        if (ggb.exists(nombre)) ggb.deleteObject(nombre);
    }

    function ocultar(nombre) {
        if (ggb.exists(nombre)) ggb.setVisible(nombre, false);
    }

    function redondear(v) {
        return Math.round(v * 10000) / 10000;
    }

    // p = { modo, curva, eval, params: [{n, v}] }
    function graficar(p) {
        var res = { ok: false, mensaje: "" };
        try {
            if (!ggb) throw new Error("La gráfica aún está cargando.");

            borrar(EVAL); borrar(HF); borrar(CURVA);

            var nuevos = p.params.map(function (q) { return q.n; });
            paramsActuales.forEach(function (n) {
                if (nuevos.indexOf(n) < 0) borrar(n);
            });

            p.params.forEach(function (q) {
                if (!ggb.exists(q.n)) {
                    ggb.evalCommand(q.n + " = Slider(-10, 10, 0.1)");
                    ggb.setVisible(q.n, false);
                }
                ggb.setValue(q.n, q.v);
            });
            paramsActuales = nuevos;

            if (!ggb.exists(X0)) { ggb.evalCommand(X0 + " = 0"); ocultar(X0); }
            if (!ggb.exists(Y0)) { ggb.evalCommand(Y0 + " = 0"); ocultar(Y0); }

            if (p.modo === "implicita") {
                ggb.evalCommand(CURVA + ": " + p.curva);
                ggb.evalCommand(HF + "(x, y) = " + p.eval);
                ggb.evalCommand(EVAL + " = " + HF + "(" + X0 + ", " + Y0 + ")");
            } else {
                ggb.evalCommand(CURVA + "(x) = " + p.curva);
                ggb.evalCommand(EVAL + " = " + CURVA + "(" + X0 + ")");
            }

            if (!ggb.exists(CURVA)) throw new Error("No pude interpretar esa expresión.");

            ggb.setColor(CURVA, 190, 0, 210);
            ggb.setLineThickness(CURVA, 6);
            ggb.setLabelVisible(CURVA, false);
            ocultar(EVAL); ocultar(HF);

            res.ok = true;
        } catch (e) {
            res.mensaje = String((e && e.message) || e);
        }
        enviar("grafica", res);
    }

    function setParam(nombre, valor) {
        if (ggb && ggb.exists(nombre)) ggb.setValue(nombre, valor);
    }

    function vista() {
        try {
            var v = JSON.parse(ggb.getViewProperties(1));
            var xMin = v.xMin, yMin = v.yMin;
            var xMax = xMin + v.width * v.invXscale;
            var yMax = yMin + v.height * v.invYscale;
            if ([xMin, xMax, yMin, yMax].every(isFinite) && xMax > xMin && yMax > yMin) {
                return { xMin: xMin, xMax: xMax, yMin: yMin, yMax: yMax };
            }
        } catch (e) { }
        return { xMin: -10, xMax: 10, yMin: -10, yMax: 10 };
    }

    function evalH(y) {
        ggb.setValue(Y0, y);
        return ggb.getValue(EVAL);
    }

    function biseccion(a, fa, b, fb) {
        var fa0 = Math.abs(fa), fb0 = Math.abs(fb);
        for (var k = 0; k < 18; k++) {
            var m = (a + b) / 2, fm = evalH(m);
            if (fm === 0) return m;
            if (fa * fm < 0) { b = m; fb = fm; } else { a = m; fa = fm; }
        }
        var r = (a + b) / 2, fr = evalH(r);
        return Math.abs(fr) <= Math.min(fa0, fb0) ? r : null;
    }

    function raices(v) {
        var NY = 120, ys = [];
        var y0 = v.yMin, f0 = evalH(y0);
        if (f0 === 0) ys.push(y0);
        for (var j = 1; j <= NY; j++) {
            var y1 = v.yMin + (v.yMax - v.yMin) * j / NY, f1 = evalH(y1);
            if (isFinite(f0) && isFinite(f1)) {
                if (f1 === 0) ys.push(y1);
                else if (f0 * f1 < 0) {
                    var r = biseccion(y0, f0, y1, f1);
                    if (r !== null) ys.push(r);
                }
            }
            y0 = y1; f0 = f1;
        }
        return ys.slice(0, 4).map(redondear);
    }

    function valorExplicito() {
        var y = ggb.getValue(EVAL);
        return isFinite(y) ? [redondear(y)] : [];
    }

    function muestrear(modo, n) {
        var res = { ok: false, mensaje: "", series: [] };
        try {
            if (!ggb || !ggb.exists(EVAL)) throw new Error("Primero grafica una función.");
            var v = vista();
            res.xMin = v.xMin; res.xMax = v.xMax; res.yMin = v.yMin; res.yMax = v.yMax;

            ggb.setRepaintingActive(false);
            try {
                for (var i = 0; i <= n; i++) {
                    var x = v.xMin + (v.xMax - v.xMin) * i / n;
                    ggb.setValue(X0, x);
                    res.series.push(modo === "implicita" ? raices(v) : valorExplicito());
                }
            } finally {
                ggb.setRepaintingActive(true);
            }
            res.ok = true;
        } catch (e) {
            res.mensaje = String((e && e.message) || e);
        }
        enviar("muestras", res);
    }

    // ---------- Inicio ----------
    if (typeof GGBApplet === "undefined") {
        enviar("error", "No se pudo descargar GeoGebra (deployggb.js). Revisa tu internet.");
    } else {
        var params = {
            "id": "ggbApplet",
            "appName": "graphing",
            "width": Math.max(window.innerWidth, 300),
            "height": Math.max(window.innerHeight, 300),
            "showToolBar": false,
            "showAlgebraInput": false,
            "showMenuBar": false,
            "showSideBar": false,
            "enableLabelDrags": false,
            "enableShiftDragZoom": true,
            "showResetIcon": false,
            "appletOnLoad": function (api) {
                ggb = api;
                ggb.setGridVisible(true);
                ggb.setAxesVisible(true, true);
                enviar("listo", "");
            }
        };
        var applet = new GGBApplet(params, true);
        window.addEventListener("load", function () { applet.inject('ggb-element'); });
        window.addEventListener("resize", function () {
            if (ggb) ggb.setSize(window.innerWidth, window.innerHeight);
        });
    }
</script>
</body>
</html>
